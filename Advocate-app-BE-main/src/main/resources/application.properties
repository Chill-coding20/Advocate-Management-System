app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===========================
# MAIL / SMTP
# Override via env: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# ===========================
