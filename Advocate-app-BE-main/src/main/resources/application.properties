spring.application.name=advocate-app
spring.profiles.active=dev

# ===========================
# DATABASE
# Override via env: DB_URL, DB_USERNAME, DB_PASSWORD
# ===========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/advocate_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Chill.code20}

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# ===========================
# JWT
# Override via env: JWT_SECRET
# ===========================
