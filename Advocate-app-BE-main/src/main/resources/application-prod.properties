# ===========================
# PROD PROFILE
# Override via: --spring.profiles.active=prod
# ===========================

# Security: never show SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.advocate.com.advocate_app=INFO
logging.level.org.hibernate.SQL=WARN

# Production DDL (use validate or none, rely on migrations)
spring.jpa.hibernate.ddl-auto=validate

# Production multipart limits (prevent large uploads)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
